<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Username Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Random Username Generator</h1>

        <label for="numNames">Number of usernames:</label>
        <input type="range" id="numNames" min="1" max="50" value="1">
        <span id="numNamesDisplay">1</span>
        <br>

        <label for="includeNumbers">Include Numbers:</label>
        <input type="checkbox" id="includeNumbers">
        <br>

        <label for="includeSpecialChars">Include Special Characters:</label>
        <input type="checkbox" id="includeSpecialChars">
        <br>

        <button id="generate-btn">Generate Usernames</button>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
