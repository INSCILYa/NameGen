<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Username Generator</title>
    <link rel="stylesheet" href="styles.css">  <!-- Link to the external CSS file -->
</head>
<body>
    <h1>Username Generator</h1>

    <!-- Number of Usernames Control -->
    <label for="numNames">Number of Usernames:</label>
    <input type="range" id="numNames" min="1" max="50" value="1">
    <span id="numNamesDisplay">1</span>
    <br>

    <!-- Generate Button -->
    <button id="generate-btn">Generate Usernames</button>

    <!-- Result Container -->
    <div id="result"></div>

    <script src="script.js"></script>  <!-- Link to the external JavaScript file -->
</body>
</html>
